<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Стрим скоро начнётся — maseaaao</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0a0f;
            --accent-pink: #e4a0c4;
            --accent-purple: #a78bfa;
            --accent-lavender: #c4b5fd;
            --text-primary: #f5f5f7;
            --text-secondary: #b4b4bb;
            --glow-pink: rgba(228, 160, 196, 0.4);
            --glow-purple: rgba(167, 139, 250, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: var(--bg-dark);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Ambient background */
        @keyframes ambientFloat {
            0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
            33% { transform: translate3d(2%, 1%, 0) scale(1.02); }
            66% { transform: translate3d(-1%, 2%, 0) scale(0.98); }
        }

        body::before {
            content: '';
            position: absolute;
            top: -20%;
            left: -20%;
            width: 140%;
            height: 140%;
            background: 
                radial-gradient(ellipse at 25% 30%, rgba(167, 139, 250, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 75% 70%, rgba(228, 160, 196, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(196, 181, 253, 0.06) 0%, transparent 60%);
            animation: ambientFloat 15s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        /* Floating particles */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 0.3vmin;
            height: 0.3vmin;
            min-width: 2px;
            min-height: 2px;
            background: var(--accent-lavender);
            border-radius: 50%;
            opacity: 0;
            animation: floatUp 12s ease-in-out infinite;
        }

        @keyframes floatUp {
            0% {
                opacity: 0;
                transform: translateY(10vh) scale(0);
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                opacity: 0;
                transform: translateY(-10vh) scale(1);
            }
        }

        /* Content */
        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4vmin;
            padding: 5vmin;
        }

        .username {
            font-size: clamp(32px, 8vmin, 72px);
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-lavender), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 60px var(--glow-pink);
            animation: glow 3s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { filter: drop-shadow(0 0 2vmin var(--glow-purple)); }
            to { filter: drop-shadow(0 0 4vmin var(--glow-pink)); }
        }

        .status {
            font-size: clamp(16px, 4.5vmin, 42px);
            font-weight: 500;
            color: var(--text-primary);
            letter-spacing: clamp(2px, 0.8vmin, 8px);
            text-transform: uppercase;
            opacity: 0.9;
        }

        .hint {
            font-size: clamp(12px, 2.5vmin, 24px);
            color: var(--text-secondary);
            font-weight: 400;
            margin-top: 2vmin;
        }

        /* Decorative ring */
        .ring {
            position: absolute;
            width: 55vmin;
            height: 55vmin;
            border: 1px solid rgba(167, 139, 250, 0.1);
            border-radius: 50%;
            animation: ringPulse 8s ease-in-out infinite;
        }

        .ring:nth-child(2) {
            width: 65vmin;
            height: 65vmin;
            animation-delay: -2s;
        }

        .ring:nth-child(3) {
            width: 75vmin;
            height: 75vmin;
            animation-delay: -4s;
        }

        @keyframes ringPulse {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.05); opacity: 0.1; }
        }

        /* Animated dots */
        .dots {
            display: flex;
            gap: clamp(6px, 1.2vmin, 12px);
            margin-top: 1vmin;
        }

        .dot {
            width: clamp(6px, 1.2vmin, 10px);
            height: clamp(6px, 1.2vmin, 10px);
            background: var(--accent-purple);
            border-radius: 50%;
            animation: dotPulse 1.5s ease-in-out infinite;
        }

        .dot:nth-child(2) { animation-delay: 0.3s; }
        .dot:nth-child(3) { animation-delay: 0.6s; }

        @keyframes dotPulse {
            0%, 100% { transform: scale(1); opacity: 0.4; }
            50% { transform: scale(1.3); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="particles">
        <script>
            const container = document.querySelector('.particles');
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 12 + 's';
                particle.style.animationDuration = (8 + Math.random() * 8) + 's';
                const size = 0.3 + Math.random() * 0.4;
                particle.style.width = size + 'vmin';
                particle.style.height = size + 'vmin';
                const colors = ['#e4a0c4', '#a78bfa', '#c4b5fd'];
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                container.appendChild(particle);
            }
        </script>
    </div>

    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>

    <div class="content">
        <h1 class="username">maseaaao</h1>
        <p class="status">Стрим скоро начнётся</p>
        <div class="dots">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>
        <p class="hint">устраивайтесь поудобнее ✨</p>
    </div>
</body>
</html>
