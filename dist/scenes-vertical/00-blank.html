<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Пустой фон — maseaaao</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geologica:wght@100..900&family=Onest:wght@100..900&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="./obs-scene.css" />
  </head>
  <body data-scene="blank">
    <main class="scene-viewport">
      <section class="scene-stage" aria-label="Пустой фон">
        <div class="blank-canvas">
          <section class="blank-brand" aria-label="Центральный блок maseaaao">
            <div class="blank-brand__stack">
              <div class="blank-brand__qr">
                <img
                  src="../assets/maseaaao.com.jpeg"
                  alt="QR-код на сайт maseaaao.com"
                  width="800"
                  height="800"
                  loading="eager"
                  fetchpriority="high"
                  decoding="async" />
              </div>
              <h1 class="blank-brand__name">maseaaao</h1>
              <span class="blank-brand__live">LIVE</span>
            </div>
          </section>
        </div>
      </section>
    </main>
    <script src="./obs-scene.js"></script>
  </body>
</html>
