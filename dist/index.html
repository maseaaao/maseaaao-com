  <style>
    :root {
      --bg-dark: #0a0a0f;
      --bg-card: rgba(255, 255, 255, 0.03);
      --accent-pink: #e4a0c4;
      --accent-purple: #a78bfa;
      --accent-lavender: #c4b5fd;
      --text-primary: #f5f5f7;
      --text-secondary: #b4b4bb;
      --glow-pink: rgba(228, 160, 196, 0.4);
      --glow-purple: rgba(167, 139, 250, 0.3);
      --focus-ring: rgba(167, 139, 250, 0.6);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Quicksand', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-dark);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 20px 60px;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient background */
    @keyframes ambientFloat {
      0%, 100% { transform: translate3d(0, 0, 0); }
      33% { transform: translate3d(1%, 0.5%, 0); }
      66% { transform: translate3d(-0.5%, 1%, 0); }
    }

    body::before {
      content: '';
      position: fixed;
      top: -10%;
      left: -10%;
      width: 120%;
      height: 120%;
      background:
        radial-gradient(ellipse at 20% 20%, rgba(167, 139, 250, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(228, 160, 196, 0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(196, 181, 253, 0.04) 0%, transparent 60%);
      animation: ambientFloat 20s ease-in-out infinite;
      pointer-events: none;
      z-index: -1;
      will-change: transform;
    }

    /* Floating particles */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: var(--accent-lavender);
      border-radius: 50%;
      opacity: 0;
      animation: float var(--duration, 14s) infinite;
      animation-delay: var(--delay, 0s);
      left: var(--left, 50%);
      will-change: transform;
      backface-visibility: hidden;
    }

    @keyframes float {
      0% { transform: translateY(100vh) scale(0); opacity: 0; }
      10% { opacity: 0.6; }
      90% { opacity: 0.6; }
      100% { transform: translateY(-100px) scale(1); opacity: 0; }
    }

    .container {
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 1;
    }

    /* Profile Section */
    .profile {
      text-align: center;
      margin-bottom: 32px;
      opacity: 0;
      animation: fadeIn 0.6s ease forwards;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    .avatar-wrapper {
      position: relative;
      display: inline-block;
      margin-bottom: 20px;
    }

    .avatar-glow {
      position: absolute;
      inset: -4px;
      background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple), var(--accent-lavender));
      border-radius: 50%;
      filter: blur(12px);
      opacity: 0.6;
      animation: pulseGlow 3s ease-in-out infinite;
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      position: relative;
      border: 3px solid rgba(255, 255, 255, 0.1);
      transition: transform 0.3s ease;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
    }

    .avatar:hover {
      transform: scale(1.05);
    }

    .avatar-fallback {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      position: relative;
      border: 3px solid rgba(255, 255, 255, 0.1);
    }

    .username {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .bio {
      font-size: 1rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    /* Donate Section */
    .donate-section {
      margin-bottom: 24px;
      opacity: 0;
      animation: fadeIn 0.6s ease forwards;
      animation-delay: 0.1s;
    }

    .donate-title {
      font-size: 0.85rem;
      color: var(--text-secondary);
      text-align: center;
      margin-bottom: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .donate-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .donate-card {
      position: relative;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px;
      background: linear-gradient(135deg,
          rgba(228, 160, 196, 0.08) 0%,
          rgba(167, 139, 250, 0.08) 100%);
      border: 1px solid rgba(228, 160, 196, 0.2);
      border-radius: 16px;
      color: var(--text-primary);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
      -webkit-tap-highlight-color: rgba(228, 160, 196, 0.2);
    }

    .donate-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg,
          rgba(228, 160, 196, 0.15) 0%,
          rgba(167, 139, 250, 0.15) 100%);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .donate-card:hover::before,
    .donate-card:focus::before {
      opacity: 1;
    }

    .donate-card:hover,
    .donate-card:focus {
      transform: translateY(-3px);
      border-color: rgba(228, 160, 196, 0.4);
      box-shadow:
        0 12px 40px rgba(0, 0, 0, 0.3),
        0 0 25px rgba(228, 160, 196, 0.2),
        0 0 50px rgba(167, 139, 250, 0.1);
    }

    .donate-card:focus {
      outline: none;
      box-shadow:
        0 12px 40px rgba(0, 0, 0, 0.3),
        0 0 0 3px var(--focus-ring),
        0 0 25px rgba(228, 160, 196, 0.2);
    }

    .donate-card:active {
      transform: scale(0.98);
    }

    .donate-qr {
      width: 140px;
      height: 140px;
      border-radius: 12px;
      background: white;
      margin-bottom: 12px;
      position: relative;
      z-index: 1;
      object-fit: cover;
      transition: transform 0.3s ease;
      /* Четкость QR */
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
    }

    .donate-card:hover .donate-qr {
      transform: scale(1.03);
    }

    .donate-card-text {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .donate-label {
      font-size: 0.95rem;
      font-weight: 600;
      position: relative;
      z-index: 1;
      background: linear-gradient(90deg, var(--accent-pink), var(--accent-lavender));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-align: center;
    }

    .donate-sublabel {
      font-size: 0.75rem;
      color: var(--text-secondary);
      position: relative;
      z-index: 1;
      margin-top: 4px;
      opacity: 0.7;
    }

    /* Links Section */
    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link-item {
      --item-delay: 0.1s;
      position: relative;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      background: var(--bg-card);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      color: var(--text-primary);
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 0.5s ease forwards;
      animation-delay: var(--item-delay);
      -webkit-tap-highlight-color: rgba(167, 139, 250, 0.2);
    }

    .link-item:nth-child(1) { --item-delay: 0.15s; }
    .link-item:nth-child(2) { --item-delay: 0.2s; }
    .link-item:nth-child(3) { --item-delay: 0.25s; }
    .link-item:nth-child(4) { --item-delay: 0.3s; }
    .link-item:nth-child(5) { --item-delay: 0.35s; }
    .link-item:nth-child(6) { --item-delay: 0.4s; }
    .link-item:nth-child(7) { --item-delay: 0.45s; }

    @keyframes fadeInUp {
      to { opacity: 1; transform: translateY(0); }
    }

    .link-item::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg,
          rgba(228, 160, 196, 0.1) 0%,
          rgba(167, 139, 250, 0.1) 100%);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .link-item:hover::before,
    .link-item:focus::before {
      opacity: 1;
    }

    .link-item:hover,
    .link-item:focus {
      transform: translateY(-2px);
      border-color: rgba(167, 139, 250, 0.3);
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.3),
        0 0 0 1px rgba(167, 139, 250, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .link-item:focus {
      outline: none;
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.3),
        0 0 0 3px var(--focus-ring),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .link-item:focus:not(:focus-visible) {
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.3),
        0 0 0 1px rgba(167, 139, 250, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .link-item:focus-visible {
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.3),
        0 0 0 3px var(--focus-ring),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .link-item:active {
      transform: scale(0.98);
    }

    .link-icon {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
      flex-shrink: 0;
    }

    .link-icon svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
      transition: transform 0.3s ease;
    }

    .link-item:hover .link-icon svg,
    .link-item:focus .link-icon svg {
      transform: scale(1.1);
    }

    .link-text {
      position: relative;
      z-index: 1;
      flex-grow: 1;
    }

    .link-arrow {
      position: relative;
      z-index: 1;
      opacity: 0.4;
      transition: all 0.3s ease;
    }

    .link-item:hover .link-arrow,
    .link-item:focus .link-arrow {
      opacity: 0.8;
      transform: translateX(4px);
    }

    /* Platform-specific accent colors */
    .link-item.twitch:hover,
    .link-item.twitch:focus { border-color: rgba(145, 70, 255, 0.4); }

    .link-item.tiktok:hover,
    .link-item.tiktok:focus { border-color: rgba(255, 0, 80, 0.4); }

    .link-item.telegram:hover,
    .link-item.telegram:focus { border-color: rgba(38, 165, 228, 0.4); }

    .link-item.youtube:hover,
    .link-item.youtube:focus { border-color: rgba(255, 0, 0, 0.4); }

    /* Footer */
    .footer {
      text-align: center;
      margin-top: 40px;
      padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .footer-text {
      font-size: 0.75rem;
      color: var(--text-secondary);
      opacity: 0.5;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .heart {
      color: var(--accent-pink);
      animation: heartbeat 1.5s ease-in-out infinite;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }

    /* ===== RESPONSIVE ===== */

    /* Большие экраны (планшеты и десктоп) */
    @media (min-width: 481px) {
      .container {
        max-width: 480px;
      }

      .donate-qr {
        width: 160px;
        height: 160px;
      }

      .donate-card {
        padding: 24px 20px;
      }

      .donate-label {
        font-size: 1rem;
      }
    }

    @media (min-width: 768px) {
      body {
        padding: 60px 20px 80px;
      }

      .container {
        max-width: 520px;
      }

      .donate-grid {
        gap: 16px;
      }

      .donate-qr {
        width: 180px;
        height: 180px;
      }

      .donate-card {
        padding: 28px 24px;
        border-radius: 20px;
      }

      .donate-label {
        font-size: 1.1rem;
      }

      .donate-sublabel {
        font-size: 0.8rem;
        margin-top: 6px;
      }

      .link-item {
        padding: 18px 24px;
      }
    }

    /* Мобильные (до 480px) */
    @media (max-width: 480px) {
      body {
        padding: 30px 16px 50px;
      }

      .avatar,
      .avatar-fallback {
        width: 100px;
        height: 100px;
      }

      .avatar-fallback {
        font-size: 2.5rem;
      }

      .username {
        font-size: 1.5rem;
      }

      .link-item {
        padding: 14px 16px;
      }

      .donate-grid {
        gap: 10px;
      }

      .donate-qr {
        width: 120px;
        height: 120px;
      }

      .donate-card {
        padding: 16px 12px;
      }

      .donate-label {
        font-size: 0.9rem;
      }
    }

    /* Узкие экраны (до 380px) - карточки в колонку */
    @media (max-width: 380px) {
      .donate-grid {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .donate-card {
        flex-direction: row;
        padding: 16px;
        gap: 16px;
      }

      .donate-qr {
        width: 110px;
        height: 110px;
        margin-bottom: 0;
        flex-shrink: 0;
      }

      .donate-card-text {
        align-items: flex-start;
        justify-content: center;
      }

      .donate-label {
        font-size: 1rem;
        text-align: left;
      }

      .donate-sublabel {
        text-align: left;
      }
    }

    /* Очень узкие экраны */
    @media (max-width: 320px) {
      .container {
        max-width: 100%;
      }

      .link-item {
        padding: 12px 14px;
        gap: 10px;
        font-size: 0.9rem;
      }

      .link-icon svg {
        width: 20px;
        height: 20px;
      }

      .donate-qr {
        width: 90px;
        height: 90px;
      }

      .donate-label {
        font-size: 0.9rem;
      }
    }

    /* Landscape на мобильных */
    @media (max-height: 500px) and (orientation: landscape) {
      body {
        padding: 20px 20px 30px;
      }

      .avatar,
      .avatar-fallback {
        width: 80px;
        height: 80px;
      }

      .profile {
        margin-bottom: 20px;
      }

      .links {
        gap: 10px;
      }

      .link-item {
        padding: 12px 16px;
      }

      .donate-section {
        margin-bottom: 16px;
      }

      .donate-grid {
        grid-template-columns: 1fr 1fr;
      }

      .donate-qr {
        width: 100px;
        height: 100px;
      }

      .donate-card {
        flex-direction: column;
        padding: 14px 12px;
      }

      .donate-qr {
        margin-bottom: 8px;
      }
    }

    .skip-link {
      position: absolute;
      top: -40px;
      left: 0;
      background: var(--accent-purple);
      color: white;
      padding: 8px 16px;
      z-index: 100;
      border-radius: 0 0 8px 0;
      transition: top 0.3s;
    }

    .skip-link:focus {
      top: 0;
    }
  </style>
</head>
