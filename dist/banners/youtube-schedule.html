<!doctype html>
<html lang="ru" class="youtube-banner">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>YouTube баннер расписания - maseaaao</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geologica:wght@100..900&family=Onest:wght@100..900&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="./banner.css" />
  </head>
  <body>
    <main class="banner-viewport">
      <section
        class="banner-stage"
        aria-label="YouTube баннер с расписанием стримов">
        <div class="banner-shell">
          <section class="schedule-banner" aria-label="Безопасная зона YouTube">
            <div class="schedule-banner__top">
              <span class="kicker">maseaaao live</span>
              <span class="platform-pill">
                <svg
                  role="img"
                  viewBox="0 0 24 24"
                  xmlns="http://www.w3.org/2000/svg">
                  <title>YouTube</title>
                  <path
                    d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z" />
                </svg>
                YouTube
              </span>
            </div>

            <div class="schedule-banner__body">
              <div class="schedule-copy">
                <h1 class="schedule-title">Вечерние<br />стримы</h1>
              </div>

              <div class="schedule-list">
                <article class="schedule-item">
                  <span class="schedule-item__icon">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                      <path
                        d="M20 15.4A8.4 8.4 0 0 1 8.6 4a7.7 7.7 0 1 0 11.4 11.4Z" />
                    </svg>
                  </span>
                  <span class="schedule-item__copy">
                    <span class="label">Пн-Пт</span>
                    <strong class="schedule-item__title">каждый вечер</strong>
                    <span class="schedule-item__note">анонс перед стартом</span>
                  </span>
                </article>

                <article class="schedule-item schedule-item--weekend">
                  <span class="schedule-item__icon">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                      <path
                        d="M12 3l1.5 4.4L18 9l-4.5 1.6L12 15l-1.5-4.4L6 9l4.5-1.6L12 3Z" />
                      <path
                        d="M19 14l.8 2.2L22 17l-2.2.8L19 20l-.8-2.2L16 17l2.2-.8L19 14Z" />
                    </svg>
                  </span>
                  <span class="schedule-item__copy">
                    <span class="label">Сб-Вс</span>
                    <strong class="schedule-item__title">по анонсам</strong>
                    <span class="schedule-item__note">днем или вечером</span>
                  </span>
                </article>
              </div>
            </div>

            <div class="schedule-banner__footer">
              <div class="day-rail" aria-label="Дни недели">
                <span class="day-pill">Пн</span>
                <span class="day-pill">Вт</span>
                <span class="day-pill">Ср</span>
                <span class="day-pill">Чт</span>
                <span class="day-pill">Пт</span>
                <span class="day-pill day-pill--soft">Сб</span>
                <span class="day-pill day-pill--soft">Вс</span>
              </div>
              <div class="social-row" aria-label="Социальные сети">
                <span class="social-link">
                  <svg
                    role="img"
                    viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg">
                    <path
                      d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z" />
                  </svg>
                  @maseaaao
                </span>
                <span class="social-link">
                  <svg
                    class="icon icon--fill"
                    viewBox="0 0 24 24"
                    aria-hidden="true">
                    <path
                      d="M21 4 3.8 10.9c-1.1.4-1 1.9.1 2.2l4.3 1.2 1.7 5.1c.3.9 1.5 1.1 2.1.4l2.4-2.8 4.5 3.3c.8.6 2 .1 2.1-.9L23 5.3c.1-.9-.9-1.5-2-.9ZM9 13.7l9.4-5.9-7.7 7.7-.3 2.3L9 13.7Z" />
                  </svg>
                  Telegram
                </span>
              </div>
            </div>
          </section>
        </div>
      </section>
    </main>
    <script src="./banner.js"></script>
  </body>
</html>
