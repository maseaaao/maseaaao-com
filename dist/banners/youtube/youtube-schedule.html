<!doctype html>
<html lang="ru" class="youtube-banner">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>YouTube баннер расписания — maseaaao</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geologica:wght@100..900&family=Onest:wght@100..900&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="../banner.css" />
  </head>
  <body>
    <main class="banner-viewport">
      <section class="banner-stage" aria-label="YouTube баннер с расписанием стримов">
        <div class="banner-shell">
          <section class="safe-panel youtube-safe" aria-label="Безопасная зона YouTube">
            <div class="youtube-safe__top">
              <span class="kicker">maseaaao live</span>
              <div class="weekday-strip" aria-label="Дни недели">
                <span>Пн</span>
                <span>Вт</span>
                <span>Ср</span>
                <span>Чт</span>
                <span>Пт</span>
                <span>Сб</span>
                <span>Вс</span>
              </div>
            </div>

            <div class="youtube-safe__main">
              <h1>Каждый вечер</h1>
              <div class="time-pair time-pair--copy">
                <p class="schedule-note">Анонсы и переносы — в Telegram</p>
              </div>
            </div>

            <div class="youtube-safe__footer">
              <span>YouTube @maseaaao</span>
              <span>Telegram @maseaaao</span>
            </div>
          </section>
        </div>
      </section>
    </main>
    <script src="../banner.js"></script>
  </body>
</html>
