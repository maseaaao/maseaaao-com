<!doctype html>
<html lang="ru" class="wtv-banner">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>w.tv баннер расписания — maseaaao</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geologica:wght@100..900&family=Onest:wght@100..900&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="../banner.css" />
  </head>
  <body>
    <main class="banner-viewport">
      <section class="banner-stage" aria-label="w.tv баннер с расписанием стримов">
        <div class="banner-shell">
          <section class="wtv-frame">
            <div class="wtv-panel">
              <div class="wtv-panel__brand">
                <span class="kicker">maseaaao live</span>
                <h1>Каждый день</h1>
                <div class="weekday-strip" aria-label="Каждый день недели">
                  <span>Пн</span>
                  <span>Вт</span>
                  <span>Ср</span>
                  <span>Чт</span>
                  <span>Пт</span>
                  <span>Сб</span>
                  <span>Вс</span>
                </div>
              </div>

              <div class="wtv-panel__times" aria-label="Время старта">
                <span class="wtv-time">
                  <strong>18:00</strong>
                  <span>МСК</span>
                </span>
                <span class="wtv-divider" aria-hidden="true"></span>
                <span class="wtv-time">
                  <strong>20:00</strong>
                  <span>Алматы</span>
                </span>
              </div>

              <div class="wtv-panel__meta">
                <div class="wtv-socials" aria-label="Социальные сети">
                  <span>YouTube @maseaaao</span>
                  <span>Telegram @maseaaao</span>
                </div>
              </div>
            </div>
          </section>
        </div>
      </section>
    </main>
    <script src="../banner.js"></script>
  </body>
</html>
