<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пауза — maseaaao</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0a0f;
            --accent-pink: #e4a0c4;
            --accent-purple: #a78bfa;
            --accent-lavender: #c4b5fd;
            --text-primary: #f5f5f7;
            --text-secondary: #b4b4bb;
            --glow-pink: rgba(228, 160, 196, 0.4);
            --glow-purple: rgba(167, 139, 250, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: var(--bg-dark);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            position: relative;
        }

        /* Ambient background */
        @keyframes ambientFloat {
            0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
            33% { transform: translate3d(2%, 1%, 0) scale(1.02); }
            66% { transform: translate3d(-1%, 2%, 0) scale(0.98); }
        }

        body::before {
            content: '';
            position: absolute;
            top: -20%;
            left: -20%;
            width: 140%;
            height: 140%;
            background: 
                radial-gradient(ellipse at 30% 25%, rgba(228, 160, 196, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 75%, rgba(167, 139, 250, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(196, 181, 253, 0.06) 0%, transparent 60%);
            animation: ambientFloat 18s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        /* Steam particles */
        .steam-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .steam {
            position: absolute;
            bottom: 35%;
            left: 20vmin;
            width: 20vmin;
            height: 30vmin;
        }

        .steam-particle {
            position: absolute;
            width: 2vmin;
            height: 2vmin;
            background: radial-gradient(circle, rgba(196, 181, 253, 0.3) 0%, transparent 70%);
            border-radius: 50%;
            animation: steam 4s ease-out infinite;
        }

        @keyframes steam {
            0% {
                opacity: 0;
                transform: translateY(0) scale(0.5);
            }
            20% {
                opacity: 0.4;
            }
            100% {
                opacity: 0;
                transform: translateY(-15vmin) translateX(var(--drift)) scale(2);
            }
        }

        /* Floating particles */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 0.3vmin;
            height: 0.3vmin;
            min-width: 2px;
            min-height: 2px;
            background: var(--accent-lavender);
            border-radius: 50%;
            opacity: 0;
            animation: floatUp 12s ease-in-out infinite;
        }

        @keyframes floatUp {
            0% {
                opacity: 0;
                transform: translateY(10vmin) scale(0);
            }
            10% {
                opacity: 0.5;
            }
            90% {
                opacity: 0.5;
            }
            100% {
                opacity: 0;
                transform: translateY(-10vmin) scale(1);
            }
        }

        /* Content */
        .content {
            position: relative;
            z-index: 10;
            text-align: left;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 3vmin;
            padding: 5vmin;
            margin-left: 8vmin;
        }

        .tea-icon {
            font-size: clamp(60px, 14vmin, 120px);
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 0 3vmin var(--glow-pink));
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-1.5vmin); }
        }

        .username {
            font-size: clamp(24px, 5.5vmin, 48px);
            font-weight: 600;
            background: linear-gradient(135deg, var(--accent-lavender), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .status {
            font-size: clamp(28px, 6vmin, 56px);
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: clamp(2px, 0.6vmin, 6px);
            text-transform: uppercase;
        }

        .hint {
            font-size: clamp(14px, 3vmin, 28px);
            color: var(--text-secondary);
            font-weight: 400;
            margin-top: 1vmin;
            display: flex;
            align-items: center;
            gap: 1.2vmin;
        }

        .hint-icon {
            font-size: clamp(18px, 3.5vmin, 32px);
        }

        /* Decorative elements */
        .corner {
            position: absolute;
            width: 8vmin;
            height: 8vmin;
            border: 2px solid rgba(167, 139, 250, 0.15);
        }

        .corner-tl {
            top: 5vmin;
            left: 5vmin;
            border-right: none;
            border-bottom: none;
        }

        .corner-tr {
            top: 5vmin;
            right: 5vmin;
            border-left: none;
            border-bottom: none;
        }

        .corner-bl {
            bottom: 5vmin;
            left: 5vmin;
            border-right: none;
            border-top: none;
        }

        .corner-br {
            bottom: 5vmin;
            right: 5vmin;
            border-left: none;
            border-top: none;
        }

        /* Soft pulse background circle */
        .pulse-circle {
            position: absolute;
            left: 10vmin;
            width: 50vmin;
            height: 50vmin;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(228, 160, 196, 0.08) 0%, transparent 70%);
            animation: pulse 4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div class="particles">
        <script>
            const container = document.querySelector('.particles');
            for (let i = 0; i < 25; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 12 + 's';
                particle.style.animationDuration = (8 + Math.random() * 8) + 's';
                const size = 0.3 + Math.random() * 0.4;
                particle.style.width = size + 'vmin';
                particle.style.height = size + 'vmin';
                const colors = ['#e4a0c4', '#a78bfa', '#c4b5fd'];
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                container.appendChild(particle);
            }
        </script>
    </div>

    <div class="steam-container">
        <div class="steam">
            <script>
                const steam = document.querySelector('.steam');
                for (let i = 0; i < 8; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'steam-particle';
                    particle.style.left = (30 + Math.random() * 40) + '%';
                    particle.style.setProperty('--drift', (Math.random() * 6 - 3) + 'vmin');
                    particle.style.animationDelay = Math.random() * 4 + 's';
                    particle.style.animationDuration = (3 + Math.random() * 2) + 's';
                    steam.appendChild(particle);
                }
            </script>
        </div>
    </div>

    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <div class="pulse-circle"></div>

    <div class="content">
        <div class="tea-icon">☕</div>
        <h1 class="username">maseaaao</h1>
        <p class="status">Пауза</p>
        <p class="hint">
            <span class="hint-icon">🍵</span>
            можете поставить чай
        </p>
    </div>
</body>
</html>
